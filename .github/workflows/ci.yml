name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - run: ruff check backend/app tests

  # CodeVerdict is distributed as a terminal tool, so "it runs on my machine" is not
  # a claim the README gets to make on trust — the suite runs on all three
  # platforms. The version matrix stays on Linux (that is where a 3.11-vs-3.12
  # difference would show up); macOS and Windows pin one version each, because
  # what they are testing is the *platform*, not the interpreter.
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
            coverage: true
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install (core + dev; no code-graph binary — the suite mocks it / uses the symbol-map fallback)
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest ${{ matrix.coverage && '--cov=app --cov-report=term-missing' || '' }}
      - name: Smoke-test the CLI entry point
        # The one thing a unit test cannot cover: that the installed console
        # script actually resolves and runs on this platform. `doctor` exits 1
        # when something blocks a run, which is expected on a bare runner with no
        # provider keys — anything above 1 is a crash, and that is the failure
        # this step is here to catch.
        shell: bash
        run: |
          codeverdict --version
          set +e
          codeverdict doctor --json
          rc=$?
          set -e
          test "$rc" -le 1
